<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PTFS RP Aviation</title>
</head>
<body>

  <h1>PTFS RP Aviation ✈️</h1>

  <h2>Créer un compte</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Mot de passe"><br><br>
  <button onclick="register()">S'inscrire</button>
  <button onclick="login()">Se connecter</button>

  <p id="message"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
    from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
  import { getFirestore, setDoc, doc } 
    from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDcydBIUb8FinRubDtmRQK8ga963JhnyZI",
    authDomain: "ptfs-rpfr.firebaseapp.com",
    projectId: "ptfs-rpfr",
    storageBucket: "ptfs-rpfr.firebasestorage.app",
    messagingSenderId: "521408549468",
    appId: "1:521408549468:web:a5ef60644c1fe245b44c99"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.register = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      await setDoc(doc(db, "utilisateurs", user.uid), {
        email: email,
        miles: 0
      });

      document.getElementById("message").innerText = "Compte créé ✅";
    } catch (error) {
      document.getElementById("message").innerText = error.message;
    }
  }

  window.login = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      document.getElementById("message").innerText = "Connexion réussie ✅";
    } catch (error) {
      document.getElementById("message").innerText = error.message;
    }
  }

</script>

</body>
</html>
